swagger: '2.0'
info:
  title: Games API
  version: '1.0.0'
  description: |
    ### Games API Documentation

    Use the **Authorize** button to send `x-user-id` header (`1` for Admin, `2` for Regular User).
    - **Guest (No header):** View games (`GET`)
    - **User (`x-user-id: 2`):** View (`GET`) and create games (`POST`)
    - **Admin (`x-user-id: 1`):** Full access (`GET`, `POST`, `PUT`, `DELETE`)

securityDefinitions:
  UserIdAuth:
    type: apiKey
    name: x-user-id
    in: header
    description: "Enter user ID (1 for Admin, 2 for Regular User)"

paths:
  /games:
    get:
      tags:
        - games
      summary: Get a list of all games
      description: Returns a list of all games in API (Public access)
      responses:
        '200':
          description: Returns a list of games
          schema:
            type: array
            items:
              $ref: '#/definitions/Game'

    post:
      tags:
        - games
      summary: Creates a game (Authenticated Users)
      description: Creates a new game. Requires x-user-id header.
      security:
        - UserIdAuth: []
      parameters:
        - in: body
          name: body
          description: A new game to be created
          required: true
          schema:
            $ref: '#/definitions/NewGame'
      responses:
        '201':
          description: Game created successfully
          headers:
            Location:
              type: string
              description: URL of the newly created game
          schema:
            $ref: '#/definitions/Game'
        '400':
          description: Missing required fields or invalid parameter values
          schema:
            $ref: '#/definitions/error'
        '401':
          description: Unauthorized (Missing or invalid x-user-id header)
          schema:
            $ref: '#/definitions/error'
        '409':
          description: Game with the same title already exists
          schema:
            $ref: '#/definitions/error'

  /games/{id}:
    get:
      tags:
        - games
      summary: Get full details of a given game
      description: Returns full details of a given game by ID (Public access)
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the game
      responses:
        '200':
          description: Full details of a given game
          schema:
            $ref: '#/definitions/Game'
        '400':
          description: Invalid ID format
          schema:
            $ref: '#/definitions/error'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/error'

    put:
      tags:
        - games
      summary: Update a game (Admin only)
      description: Updates an existing game by ID. Admin only.
      security:
        - UserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the game to update
        - in: body
          name: body
          description: Game object with updated data
          required: true
          schema:
            $ref: '#/definitions/NewGame'
      responses:
        '200':
          description: Game updated successfully
          schema:
            $ref: '#/definitions/Game'
        '400':
          description: Invalid ID format or parameter values
          schema:
            $ref: '#/definitions/error'
        '401':
          description: Unauthorized (Missing or invalid x-user-id)
          schema:
            $ref: '#/definitions/error'
        '403':
          description: Forbidden (Admin role required)
          schema:
            $ref: '#/definitions/error'
        '404':
          description: Game was not found
          schema:
            $ref: '#/definitions/error'
        '409':
          description: Game with the same title already exists
          schema:
            $ref: '#/definitions/error'

    delete:
      tags:
        - games
      summary: Delete a game (Admin only)
      description: Deletes a game from the array by ID. Admin only.
      security:
        - UserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the game to delete
      responses:
        '204':
          description: Game deleted successfully
        '400':
          description: Invalid ID format
          schema:
            $ref: '#/definitions/error'
        '401':
          description: Unauthorized (Missing or invalid x-user-id)
          schema:
            $ref: '#/definitions/error'
        '403':
          description: Forbidden (Admin role required)
          schema:
            $ref: '#/definitions/error'
        '404':
          description: Game was not found in games array
          schema:
            $ref: '#/definitions/error'

definitions:
  Game:
    type: object
    properties:
      id:
        type: integer
        example: 1
      name:
        type: string
        example: "Witcher 3"
      price:
        type: number
        example: 29.99

  NewGame:
    type: object
    required:
      - name
      - price
    properties:
      name:
        type: string
        example: "Witcher 3: Extended Edition"
      price:
        type: number
        format: float
        example: 39.99

  error:
    type: object
    properties:
      error:
        type: string
        example: "Access denied: Admin role required"